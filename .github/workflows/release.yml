name: Release

# Builds a wheel + sdist, validates both with twine, and publishes to PyPI
# through Trusted Publishing (OIDC). No API token and no repository secret is
# involved: PyPI issues a short-lived credential to this exact job.
#
# PyPI side (already registered as a pending publisher):
#   project stocksenate | repo QuotaFuse-ai/StockSenate
#   workflow release.yml | environment pypi
# Changing either the workflow filename or the environment name here breaks
# the match and publishing fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/stocksenate/
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
