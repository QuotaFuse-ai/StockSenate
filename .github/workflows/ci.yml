name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requirement originals and the docs tree stay out of this repo. Ignore
      # rules are not enough on their own: `git add -f` and a rebased branch
      # both put files back, so the tree itself is the check.
      - name: No requirement originals or docs in the tree
        run: |
          leaks=$(git ls-files | grep -Ei '(^|/)councli|^docs/|\.(docx|pdf)$' || true)
          if [ -n "$leaks" ]; then
            echo "::error::These tracked files must not be published:"
            echo "$leaks"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m stock_senate config validate --config config
      - run: python -m stock_senate role list --config config --output json
      - run: python -m stock_senate role validate --config config
      - run: pytest

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install uv
      # --frozen refuses to touch uv.lock: a stale lock or a hand-edited
      # dependency range fails here instead of drifting silently.
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]" pip-audit
      # `stocksenate` itself is installed here and is not on PyPI yet, so it can
      # never be audited; --skip-editable reports it as skipped instead of
      # failing. Not using --strict for that same reason: it would turn "our own
      # package is unpublished" into a red job without saying anything about the
      # third-party dependencies this gate exists to check.
      - run: pip-audit --skip-editable --progress-spinner off

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # DEC-007: Google Gemini is verified in an isolated job because
  # mootdx pins httpx<0.26 while google-genai needs httpx>=0.28.1.
  dependency-isolation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "."
      - run: pip install google-genai
      - run: pip check
