# StockSenate 工作流拓扑

[topology]
# 固定主干，可增删分析师、可调整辩论轮数，不可跳过终审。
pipeline = [
  "analysts",
  "bull_bear_debate",
  "research_manager",
  "trader",
  "risk_debate",
  "portfolio_manager",
]
# 只允许从这些分析师的报告开始聚合成研究材料。
analyst_inputs = "all_enabled"

[debate]
max_debate_rounds = 2
max_risk_discuss_rounds = 2
# 收敛判定：连续两轮新增论点占比低于阈值即提前结束。
convergence_enabled = true
convergence_min_new_points_ratio = 0.2
convergence_max_rounds = 5

[hitl]
enabled = true
# 允许人工介入的检查点；顺序即执行顺序。
checkpoints = ["after_trader", "before_final"]
# 非交互环境（CLI --no-hitl / CI）默认放行，但必须在报告中记录 auto_approved。
on_timeout = "auto_approve"
timeout_seconds = 1800

[checkpoint]
enabled = false
backend = "sqlite"
path = "~/.stock_senate/checkpoints.sqlite"
# 同一 code+date 的断点可恢复，避免重复消耗 LLM 调用。
resume_by = ["code", "date", "config_hash"]

[logging]
# 默认只写 stderr；开启后同一份 JSON 日志会镜像到轮转文件。
# 相对路径按 state 根目录解析；例如 logs/stock_senate.jsonl。
file_enabled = false
file_path = "~/.stock_senate/logs/stock_senate.jsonl"
max_bytes = 10485760
backup_count = 5

[incremental]
# 增量分析：已有同日同标的报告时复用未变化的数据域。
enabled = true
reuse_within_seconds = 3600
invalidate_on = ["announcement", "risk_event"]

[quality_gate]
enabled = true
threshold = 70
# 评分方式：rules 确定性规则（默认，不调用模型）/ judge 评审模型独立打分 /
# hybrid 两者加权。judge 与 hybrid 在模型不可用或 offline 时自动回退 rules。
mode = "rules"
# hybrid 模式下评审分的权重（0~1）。
judge_weight = 0.5
# 低于阈值不阻断交付，但决策标记为 low_quality 并要求人工复核。
block_on_fail = false
dimensions = ["logic_coherence", "evidence_sufficiency", "citation_accuracy"]

[compression]
# 上下文压缩；超过阈值时按证据单元切块，引用与来源字段保留。
enabled = true
trigger_tokens = 24000
chunk_tokens = 6000
# 拼接后整体仍超限时，压缩完的上下文再按此上限收紧。
max_output_tokens = 24000
keep_citations = true

[memory]
# 长期反思库：每次跑完后追加一条，下一次同标的分析注入最近若干条。
# 路径相对 state 根目录；只保存研究结论，不保存可执行价位或交易指令。
enabled = true
path = "memory/reflections.jsonl"
max_entries = 6

[tracing]
# 追踪默认关闭。开启后每个流水线阶段和每次模型调用都会生成 span，
# 并沿用同一次运行的 trace_id，便于与日志对齐。
# exporter：none / jsonl（本地文件，无额外依赖）/ otlp（OTLP/HTTP，
# 兼容 OpenTelemetry Collector 与 Langfuse 的 OTLP 接入点）。
enabled = false
exporter = "jsonl"
# 相对路径按 state 根目录解析。
path = "~/.stock_senate/traces/spans.jsonl"
# otlp 专用；Langfuse 示例：https://cloud.langfuse.com/api/public/otel
endpoint = ""
service_name = "stocksenate"
# 认证头从环境变量读取（key=value,key=value），配置里只记录变量名。
headers_env = "STOCKSENATE_OTEL_HEADERS"
timeout_seconds = 5

[budget]
# 单次分析的调用与时长上限，命中即熔断（见 budget.toml）。
max_llm_calls = 60
max_total_tokens = 400000
max_wall_clock_seconds = 1800

[queue]
# 批量队列：单任务失败后的重试与处置策略（见 budget.toml [per_queue]）。
max_attempts = 3
retry_delay_seconds = 5
# skip 跳过失败任务继续；stop 立即暂停整队并告警。
on_failure = "skip"
# running/retrying 超过该时长视为进程中断，恢复时重新排队。
stale_running_seconds = 21600
