# StockSenate 模型配置
# 依赖策略：mootdx 钉死 httpx<0.26，google-genai 要求 httpx>=0.28.1，二者结构性冲突。
# 因此本包不直接依赖 httpx，也不提供 [google] extra（见 DEC-007）。

[llm]
# 与上游一致的七个基础键，全部保留。
llm_provider = "minimax"
deep_think_llm = "MiniMax-M2"
quick_think_llm = "MiniMax-M2"
backend_url = ""            # 留空用 provider 默认；切换 provider 时不会沿用旧值
max_tokens = 8192
output_language = "Chinese"
market_lookback_days = 60
llm_timeout = 150
llm_max_retries = 3
llm_retry_delay = 5

[llm.role_llms]
# 细粒度覆盖：同一 provider+model 共用一个客户端。
# 合法键见下方 allowed_keys，写错键必须报错而不是静默忽略。
market = { provider = "minimax", model = "MiniMax-M2" }
social = { provider = "minimax", model = "MiniMax-M2" }
news = { provider = "minimax", model = "MiniMax-M2" }
fundamentals = { provider = "minimax", model = "MiniMax-M2" }
policy = { provider = "minimax", model = "MiniMax-M2" }
hot_money = { provider = "minimax", model = "MiniMax-M2" }
lockup = { provider = "minimax", model = "MiniMax-M2" }
bull = { provider = "minimax", model = "MiniMax-M2" }
bear = { provider = "minimax", model = "MiniMax-M2" }
research_manager = { provider = "minimax", model = "MiniMax-M2" }
trader = { provider = "minimax", model = "MiniMax-M2" }
risk_aggressive = { provider = "minimax", model = "MiniMax-M2" }
risk_neutral = { provider = "minimax", model = "MiniMax-M2" }
risk_conservative = { provider = "minimax", model = "MiniMax-M2" }
quality_gate = { provider = "minimax", model = "MiniMax-M2" }
portfolio_manager = { provider = "minimax", model = "MiniMax-M2" }

[llm.allowed_keys]
# 与上游 role_llms 完全对齐；别名（technical/basic/sentiment/unlock）在
# 加载时归一化到上面的规范键，重复声明报错。
keys = [
  "market", "social", "news", "fundamentals", "policy", "hot_money", "lockup",
  "bull", "bear", "research_manager", "trader",
  "risk_aggressive", "risk_neutral", "risk_conservative",
  "quality_gate", "portfolio_manager",
]
strict = true

[llm.structured_output]
# 弱模型 tool-calling 不稳定时，强制 JSON Schema 约束 + 本地校验重试。
enabled = true
max_local_retries = 2
mark_partial_on_failure = true

[llm.fallback]
# 主模型重试耗尽后的降级链；空表示不降级。
chain = []
