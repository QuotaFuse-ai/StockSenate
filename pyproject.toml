[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksenate"
version = "0.1.0"
description = "StockSenate: multi-role AI investment research senate (analysis and backtest simulation only)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "QuotaFuse" }]
keywords = ["a-share", "multi-agent", "investment-research", "llm", "langgraph", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
# httpx is intentionally NOT a direct dependency: mootdx pins httpx<0.26 while
# google-genai needs >=0.28.1. Data access goes through TickHub, so the core
# never imports httpx; optional integrations declare their own range. The two
# LLM SDKs below pull httpx transitively on their own terms (DEC-007).
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "toml>=0.10",
  # minimax (the default llm_provider) speaks the OpenAI wire protocol;
  # claude speaks Anthropic's. Imported lazily in roles/llm.py, declared here so
  # a plain `pip install .` can run `ssenate analyze` without a traceback.
  "openai>=1.40",
  "anthropic>=0.34",
]

[project.optional-dependencies]
stockdata = ["tickhub-cn>=1.0"]
# Backtest is pure Python today (no pandas/numpy imports in src/), so it has no
# extra of its own.
mcp = ["mcp>=2.0"]
webui = ["starlette>=0.37", "uvicorn>=0.30"]
all = [
  "stocksenate[stockdata,mcp,webui]",
]
# CI installs only `.[dev]`; the test suite imports the MCP server and the
# WebUI, so the dev scope must carry those extras as well.
dev = [
  "stocksenate[webui,mcp]",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
ssenate = "stock_senate.cli:main"
tradingagents = "stock_senate.cli:legacy_main"

[project.urls]
Homepage = "https://github.com/QuotaFuse-ai/StockSenate"
Repository = "https://github.com/QuotaFuse-ai/StockSenate"
Issues = "https://github.com/QuotaFuse-ai/StockSenate/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_senate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer/Click declare options as `typer.Option(...)` default arguments by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
