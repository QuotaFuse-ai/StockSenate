# StockSenate 角色定义
# 角色键（role key）是稳定契约：role_llms、CLI --name、报告字段都引用它。
# 内置 7 个分析师 + 5 个自定义槽位，合计上限 12（见 DEC-005）。

[roles.market]
display_name = "市场分析师"
description = "看量价、趋势与资金流，判断当前位置与动能强弱。"
kind = "analyst"
alias = ["technical"]
prompt = "prompts/analysts/market.md"
tools = ["kline", "quote", "money_flow"]
output_schema = "AnalystReport"
enabled = true

skills = ["tickhub-cn", "doubao-daily-stock"]
[roles.social]
display_name = "情绪分析师"
description = "看社区与社媒讨论的热度、方向与持续性，识别情绪拐点。"
kind = "analyst"
alias = ["sentiment"]
prompt = "prompts/analysts/social.md"
tools = ["social_buzz", "news_search"]
output_schema = "AnalystReport"
enabled = true

skills = ["tickhub-cn"]
[roles.news]
display_name = "新闻分析师"
description = "看新闻与公告的传导路径和影响窗口，区分已兑现与未兑现。"
kind = "analyst"
prompt = "prompts/analysts/news.md"
tools = ["news_search", "announcement"]
output_schema = "AnalystReport"
enabled = true

skills = ["tickhub-cn"]
[roles.fundamentals]
display_name = "基本面分析师"
description = "看增长、盈利、资产、估值四类财务与经营指标的质量。"
kind = "analyst"
alias = ["basic"]
prompt = "prompts/analysts/fundamentals.md"
tools = ["financial", "valuation"]
output_schema = "AnalystReport"
enabled = true

skills = ["tickhub-cn", "doubao-public-company-analysis"]
[roles.policy]
display_name = "政策分析师"
description = "看政策层级、所处阶段、传导路径与可观察的落地指标。"
kind = "analyst"
prompt = "prompts/analysts/policy.md"
tools = ["policy_feed", "news_search"]
output_schema = "AnalystReport"
enabled = true

[roles.hot_money]
display_name = "游资追踪"
description = "看龙虎榜席位与主力资金结构，判断短线资金意图。"
kind = "analyst"
prompt = "prompts/analysts/hot_money.md"
tools = ["dragon_tiger", "money_flow"]
output_schema = "AnalystReport"
enabled = true

[roles.lockup]
display_name = "解禁观察"
description = "看限售解禁窗口、股东类型与流动性吸收能力。"
kind = "analyst"
alias = ["unlock"]
prompt = "prompts/analysts/lockup.md"
tools = ["lockup_calendar", "announcement"]
output_schema = "AnalystReport"
enabled = true

[roles.bull]
display_name = "多头研究员"
description = "只从多方立场组织论点，找最强看多证据并回应空方质疑。"
kind = "researcher"
prompt = "prompts/researchers/bull.md"
tools = []
output_schema = "ResearchArgument"
enabled = true

[roles.bear]
display_name = "空头研究员"
description = "只从空方立场组织论点，找最强看空证据并回应多方质疑。"
kind = "researcher"
prompt = "prompts/researchers/bear.md"
tools = []
output_schema = "ResearchArgument"
enabled = true

[roles.research_manager]
display_name = "研究经理"
description = "汇总多空论点，形成研究评级并给出改变评级的条件。"
kind = "manager"
prompt = "prompts/managers/research_manager.md"
tools = []
output_schema = "ResearchVerdict"
enabled = true

[roles.trader]
display_name = "交易员"
description = "把研究结论落成方向、周期与理由，不输出价位与仓位。"
kind = "trader"
prompt = "prompts/trader/trader.md"
tools = ["kline", "quote"]
output_schema = "TradePlan"
enabled = true

[roles.risk_aggressive]
display_name = "激进风险辩手"
description = "只强调机会与上行空间，同时压测保守观点的漏洞。"
kind = "risk"
prompt = "prompts/risk_mgmt/aggressive.md"
tools = []
output_schema = "RiskArgument"
enabled = true

[roles.risk_neutral]
display_name = "中立风险辩手"
description = "在激进与保守之间找平衡，指出信息缺口对结论的影响。"
kind = "risk"
prompt = "prompts/risk_mgmt/neutral.md"
tools = []
output_schema = "RiskArgument"
enabled = true

[roles.risk_conservative]
display_name = "保守风险辩手"
description = "只强调下行风险与失效条件，优先守住不亏。"
kind = "risk"
prompt = "prompts/risk_mgmt/conservative.md"
tools = []
output_schema = "RiskArgument"
enabled = true

[roles.portfolio_manager]
display_name = "投资经理"
description = "汇总全部角色观点与质量分，给出最终评级与理由。"
kind = "manager"
prompt = "prompts/managers/portfolio_manager.md"
tools = []
output_schema = "FinalDecision"
enabled = true

[roles.quality_gate]
display_name = "质量闸门"
description = "给报告打质量分，指出硬伤所在位置并给出修法。"
kind = "judge"
prompt = "prompts/managers/quality_gate.md"
tools = []
output_schema = "QualityVerdict"
enabled = true

# 自定义角色槽位：启用后计入 12 个角色上限，必须声明 kind 与 output_schema。
[custom]

[limits]
max_roles = 12
max_custom_roles = 5

[tool_permissions]
# 角色只能看到自己 tools 里列出的域；未列出的域在运行时被拒绝。
enforce = true
# 写类工具（下单、改配置）一律不提供给任何角色：本系统不做实盘交易。
deny_write_tools = true
