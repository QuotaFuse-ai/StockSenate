[skill]
name = "lark-drive"
description = "飞书云空间（云盘/云存储）：管理 Drive 文件和文件夹，包含上传/下载、创建文件夹、复制/移动/删除、查看元数据、查询权限设置、评论/权限/订阅、标题、版本、飞书文档密级标签（secure labels）和本地文件导入，也可通过 `drive +fetch` 把 Drive 文件读取为 Markdown（含知识库里映射为 wiki URL 的 Drive 文件）。用户需要整理云盘目录、处理云空间资源 URL/token、判断链接类型/真实 token/标题、读取/总结 Drive 文件的内容、或导入 Word/Markdown/Excel/CSV/PPTX/.base 为 docx/she"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\lark-drive\\SKILL.md"
prompt = "飞书云空间（云盘/云存储）：管理 Drive 文件和文件夹，包含上传/下载、创建文件夹、复制/移动/删除、查看元数据、查询权限设置、评论/权限/订阅、标题、版本、飞书文档密级标签（secure labels）和本地文件导入，也可通过 `drive +fetch` 把 Drive 文件读取为 Markdown（含知识库里映射为 wiki URL 的 Drive 文件）。用户需要整理云盘目录、处理云空间资源 URL/token、判断链接类型/真实 token/标题、读取/总结 Drive 文件的内容、或导入 Word/Markdown/Excel/CSV/PPTX/.base 为 docx/she\n\n要点：\n# drive (v1)\n\n> **术语说明：** 飞书云空间也常被称为\"云盘\"、\"云存储\"、\"网盘\"或\"我的空间\"，这些说法通常指的是同一个产品，是飞书官方的云端文件存储与管理中心。\n\n> **导入分流规则：** 如果用户要把本地 Excel / CSV / `.base` 快照导入成 Base / 多维表格 / bitable，必须优先使用 `lark-cli drive +import --type bitable`。不要先切到 `lark-base`；`lark-base` 只负责导入完成后的表内操作。\n\n> **副本分流规则：** 如果用户要复制在线文档、创建文档副本、把文档复制到另一个文件夹，必须使用 `lark-cli drive +copy`。不要用 `drive +export` 下载后再 `drive +import` 上传，也不要用 `docs +fetch` + `docs +create` 重建正文；导出/导入只用于本地文件转换或离线产物。\n\n## 快速决策\n\n- 用户要上传 `.html` 文件到云盘时，不要按普通文件走 `drive +upload`，参阅 html 技能的「发布」。\n- 妙搭 `/app/app_xxx` 的资源权限或密级操作：先按 [`apps +get`](../lark-apps/references/lark-apps-get.md) 查询 `meta_token` / `meta_doc_type`，再传给本域 shortcut 的 `--token` / `--type`（`apps` 或 `miaoda_apps`）。不要直接传应用 URL 或 app_id，也不要猜测类型；字段缺失则停止。\n- 用户要把**已有 Wiki 节点移出知识库，放到 Drive 文件夹或“我的空间”根目录**：切到 `lark-wiki`，使用 `lark-cli wiki +move-to-drive`；不要把 Wiki token 直接交给 `drive +move`。这是会改变文档归属和权限继承的写操作，执行前确认源节点与目标位置。\n- 用户要**复制文档 / 创建副本 到云盘或者文件夹**时：已提供可直接使用的 URL 或 token，按 [`references/lark-drive-copy.md`](references/lark-drive-copy.md) 使用 `lark-cli drive +copy`；仅提供标题时，先按 [`references/lark-drive-search.md`](references/lark-drive-search.md) 使用 `drive +search` 唯一定位源资源，再按 copy reference 复制。如果是要复制文档 / 创建副本到知识库，使用"
