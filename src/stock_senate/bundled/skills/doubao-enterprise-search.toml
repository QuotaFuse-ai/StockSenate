prompt = "判断是否调用 `enterprise_agentic_search` 工具前，必须先完整读取 `doubao-enterprise-search` skill。适用场景包括：用户本轮输入包含 `[企业知识]` 或 `doubao-enterprise-search` 的 Skill 调用标记；问题明确或高度可能依赖企业内部资料、内部口径、内部系统、业务背景、历史讨论、协作记录、制度流程、员工权益、差旅报销，或内部产品、项目、客户、业务数据及非飞书通讯录 ID/UID/账号/标识；用户需要搜索、追溯、复盘或汇总会议、群聊、文档、日程、项目和人员相关信息，提炼结论、待办、风险、反馈或进展；用户需要\n\n要点：\n> **读取要求：必须完整读取本 Skill 后再执行任何路由或工具调用。若本轮命中正文标明的 reference 加载条件，还必须在执行对应步骤前读取相关 reference。若单次读取被截断，必须分段继续读取；只有看到文末唯一标识 `【全文读取完成】` 才算读完。**\n\n# doubao-enterprise-search（企业搜索）\n\n## 必读摘要（先读这里）\n1. 显式入口的信息获取请求，未命中硬性排除时必须调用；语义召回入口则结合信息来源和对象边界谨慎判断。详见第 1 章。\n2. 同一检索目标默认只调用一次；围绕同一主题且可由同一批资料回答的子问题应合并，主题、对象或所需资料相互独立的问题应分别调用。query 必须是完整、可独立理解的自然语言。详见第 2 章。\n3. 本轮存在追问、省略、指代或来源切换时，必须先按需读取 [多轮上下文处理](references/multi-turn-context.md)；单轮独立问题无需读取。\n4. 无结果不能直接视为事实不存在；凡使用 `enterprise_agentic_search` 或 `lark-xxx` skill 获取的企业信息，即使后续通过代码、文件工具或其他方式加工，仍必须遵守第 3.2 节的内容使用与输出格式要求和第 3.3 节的来源引用要求；`lark-xxx` 查询失败而问题本质仍是内部信息查询时，应使用 `enterprise_agentic_search` 兜底。详见第 3 章。\n\n## 0. 定位与工具说明\n本 skill 负责判断是否调用 `enterprise_agentic_search`，并规范 query 构造、多轮继承、无结果兜底和结果使用。\n\n### `enterprise_agentic_search` 是什么\n`enterprise_agentic_search` 是企业内部知识问答与推理整合工具。它根据自然语言 query，从文档、会议记录、工作消息、邮件和用户自建知识库等来源检索、整合相关内容及来源信息，不是关键词搜索引擎。\n\n核心边界：从企业内部资料中检索和综合信息，与读取或操作具体对象，应走不同路径；具体路由统一按第 1 章判断。\n\n### `enterprise_agentic_search` 不是什么\n- 不执行文档读取、消息发送、审批提交、日程状态查询等具体对象操作 → 使用对应的 `lark-xxx`。\n- 不搜索公开网页 → 用户明确指定公开来源时，使用公开信息工具。\n- 不替代 CLI、本地文件处理或模型可直接完成的任务 → 使用本地工具或直接回答。\n\n使用 `lark-xxx` 执行带有 `--format` 参数的命令时，必须使用 `--format json`，不得使用 `--format pretty`；只有 JSON 格式能够完整"
