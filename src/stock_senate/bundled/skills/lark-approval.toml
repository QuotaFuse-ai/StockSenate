[skill]
name = "lark-approval"
description = "飞书审批：查询和处理审批待办/已办/实例，搜索可发起审批定义、查看定义详情、发起原生审批实例，以及查询、创建、回复、编辑、删除审批评论。当用户要处理审批任务、查看审批实例、搜索或发起审批、操作审批评论时使用。审批待办不是飞书任务；非审批类待办走 lark-task。不负责创建审批定义；三方审批定义不走原生提单。"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\lark-approval\\SKILL.md"
prompt = "飞书审批：查询和处理审批待办/已办/实例，搜索可发起审批定义、查看定义详情、发起原生审批实例，以及查询、创建、回复、编辑、删除审批评论。当用户要处理审批任务、查看审批实例、搜索或发起审批、操作审批评论时使用。审批待办不是飞书任务；非审批类待办走 lark-task。不负责创建审批定义；三方审批定义不走原生提单。\n\n要点：\n所有命令默认 `--as user`（审批是人的动作）。调用前先按需读取 references 下对应的文件，查参数结构，不要猜字段；**references 是第一信息源**，只有在 reference 未覆盖的原生 / 高级场景下，才额外用 `lark-cli ... --help`、`lark-cli schema` 等方式补充确认字段。\n\n## 路由优先级（先判断是不是审批，再选命令）\n\n审批待办不是飞书任务。**只要用户的核心对象是审批单据 / 审批待办 / 审批实例，就优先使用 `lark-approval`，不要让渡给 `lark-task`。**\n\n### 明确归 `lark-approval` 的高优先级语义\n\n出现以下任一语义时，优先走 `lark-approval`：\n\n- 审批待办 / 审批单据 / 审批实例 / 审批意见 / 审批定义\n- 审批评论 / 评论 / 回复；前提是上下文对象是审批实例\n- 同意 / 拒绝 / 转交 / 退回 / 撤回 / 催办 / 加签 / 抄送\n- 待办列表 / 待办单据 / 已发起审批 / 已办审批 / 审批详情 / 同意可编辑\n\n**判定规则：** 只要最终动作是对审批单据做同意、拒绝、转交、退回、撤回、催办、加签、抄送、查详情、查已发起/已办/待办，或对审批实例评论做查询、创建、回复、编辑、删除，就归 `lark-approval`。只有当用户处理的是**非审批类任务/待办**时，才走 [`lark-task`](../lark-task/SKILL.md)。\n\n## 选哪个命令\n\n| 想做什么 | 命令 | 按需读取 reference                                                                  |\n|---|---|---------------------------------------------------------------------------------|\n| 搜可发起定义 | `approvals search` | [`lark-approval-approvals-search.md`](references/lark-approval-approvals-search.md) |\n| 看审批定义详情/提单前确认表单与流程 | `approvals get` | [`lark-approval-approvals-get.md`](references/lark-approval-approvals-get.md)   |\n| 发起原生审批实例/提交请假审批/提交报销审批/创建审批实例 | `instances create` | [`lark-approval-initiate.md`](ref"
