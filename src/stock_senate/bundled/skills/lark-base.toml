[skill]
name = "lark-base"
description = "多维表格：可视化表格数据库与业务系统，可搭建台账/进度/项目/订单/客户/排班等业务场景，具备多表联动、多视图、表单问卷、仪表盘、自动化工作流、行列权限；遇到 /record/ 记录分享链接时使用"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\lark-base\\SKILL.md"
prompt = "多维表格：可视化表格数据库与业务系统，可搭建台账/进度/项目/订单/客户/排班等业务场景，具备多表联动、多视图、表单问卷、仪表盘、自动化工作流、行列权限；遇到 /record/ 记录分享链接时使用\n\n要点：\n# 多维表格（Base）\n\n## 概述\n\n按交付目标选主责 Scene，由它组织依赖、执行和交付。**第一条 `lark-cli base` 命令前读 [CLI 调用契约](references/shared-cli-invocation.md)及其[命令写法速查](references/shared-cli-invocation.md#命令写法速查)**，参数名、JSON 顶层键、返回键以它为准，不凭记忆拼。SKILL 管边界与分流，Scene 管业务决策与完成条件，Reference 管命令、协议与恢复。\n\n## 使用场景与能力边界\n\n- 用 `lark-cli base +...` shortcut，不用旧聚合式 `+table / +field / +record / +view / +history / +workspace`，不依赖 `lark-cli schema`。`lark-cli api` 只用于尚无类型化命令的仪表盘权限统计开关、全局筛选、按钮绑定，按 [Dashboard 入口](scenes/dashboard.md#任务导航)的专属协议并满足功能开关和资源条件，不作通用回退。\n- 只执行经典 Base，不执行 BaseApp／AppMode（不同资源，不混用标识；命令帮助里的应用、页面、应用组件入口也不用）；Scene 与 Reference 不能放宽此边界。\n- 只用当前用户身份 `--as user`。凭证、scope 或资源权限不足按实际错误和平台现有授权入口处理，不调未提供的认证命令，不换身份或接口绕过拒绝；Context／SQL 明确拒绝时停止受影响分析。\n\n## 核心概念与对象关系\n\n[示例代码省略]\n\n对象关系只用于判断归属、引用与受影响范围，不扩大授权。\n\n- Link 建记录关系，Formula 按表达式计算，Lookup 按条件从源表取值或聚合（无须先建 Link）；可写边界、计算结果与附件按各自协议。\n- Bitable 是 Base 的历史名称，调用路径相同；不凭历史返回字段名判断资源类型，兼容字段见 [Base 返回协议](references/base-commands.md#身份与返回)。\n\n## Base 定位与读取\n\n续接任务没给链接时沿用本会话已交付的 Base，不按标题搜索或新建；新建任务用创建返回的坐标。可信坐标和读取结果复用，只补缺的 ID；缺坐标走 [Base 定位流程](scenes/base.md#定位已有-base)按输入选路并消歧；名称和 ID 只取可信返回，不猜，不以新建替代定位。\n\n按目标读取：Base 本体走 [Base 读取](scenes/base.md#读取-base)，结构走 Table，原始明细走 Record，独立分析走 Analyze-data。先确认所需真实"
