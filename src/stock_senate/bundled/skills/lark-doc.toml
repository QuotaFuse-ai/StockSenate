[skill]
name = "lark-doc"
description = "飞书/豆包在线文档（`/docx`、`/wiki`）的阅读、新建和修改以及操作思维笔记，使用此技能。不处理 Office Word(.docx)、PDF文件；创建文档副本走 drive；`/page/<token>` 为妙搭应用，非飞书云文档"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\lark-doc\\SKILL.md"
prompt = "飞书/豆包在线文档（`/docx`、`/wiki`）的阅读、新建和修改以及操作思维笔记，使用此技能。不处理 Office Word(.docx)、PDF文件；创建文档副本走 drive；`/page/<token>` 为妙搭应用，非飞书云文档\n\n要点：\n# lark-doc\n\n## 权威经验\n\n在多轮对话的情况下，用户要求重新修改文档时，**必须重新阅读文档**，因为用户可能自己手动编辑过文件，此时文件的内容可能与上下文内容不一致，直接使用之前读取的内容会造成用户手动编辑的内容丢失。\n\n用户要求将前轮对话转换为飞书文档时，须保留可视化组件的原始格式与交互，echarts 块及 HTML 组件（含原图叠加和内嵌 SVG）均可通过 html5-block 承接，可编辑的 SVG 和 mermaid 都使用画板承接并优先保留其原格式。\n\n## skill 边界\n\n明确本 skill 的适用边界，并非所有写作任务都适用于此 skill，对于不应使用本文能力的情况请选择更加合适的 skill\n\n- 典型应该使用本 skill 的情况：\n  - 明确要求交付的是飞书/豆包在线文档\n  - 明确给定的是飞书/豆包在线文档要求基于此编辑\n  - 读取在线云文档及其评论\n\n- 典型不应该使用本 skill 的情况：\n  - 应路由到 [`word`](../word/SKILL.md) Skill：\n    - 给定 PDF 文件要求转换为 Word 文件\n    - 用户明确要求交付 Word 文件\n    - 用户提供一份 Word 文件作为模板要求基于此进行 Word 写作\n    - 用户提供一份 Word 文件要求基于此进行修改编辑\n  - 应路由到 [`lark-drive`](../lark-drive/SKILL.md):\n    - 要求把一个飞书/豆包在线文档导出为 Word 文件\n    - 添加、分页查看、回复评论或增删 reaction；读取文档评论先用 `docs +fetch`，仅当返回的评论信息无法满足需求时再用 `lark-drive` 补查。\n    - 给定一个 Word 文件要求上传为在线文档\n    - 找文档、导入导出、云空间文件上传 / 下载 / 权限管理\n    - 复制文档、创建副本或另存为副本时，按其指引使用 `drive +copy`\n\n- 对于一个**写作类**任务，但用户没有明确告知交付载体时，应该遵循如下判断\n\n  | 体裁 | 典型场景 | 默认交付载体 |\n  |---|---|---|\n  | 学术教研与基础教育教学 | 学习计划、备考路径、复习讲义、试卷与讲评、教案、公开课、教学设计、课程材料、论文写作与指导 | Word |\n  | 党政公文和其他正式文书写作 | 党政机关、事业单位、基层党组织面向体系内或公共部门的正式文书；企业、社会组织等境内法人向党政部门、事业单位提交的正式文书及党建材料；个人向政府、基层村居或党组织提交的思想汇报、申请等材料 | Word |\n  | 事业单位/国有企业/人民团体组织内的职场文书 | 事业单位、人民团体、国有企业的总"
