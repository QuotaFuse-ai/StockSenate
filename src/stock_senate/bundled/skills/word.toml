[skill]
name = "word"
description = "Office Word 的阅读、新建、修改，以及通过图片生成Word。不处理 飞书/豆包在线文档、PDF文件。党政公文、正式文书、商务与项目合同、专利司法等专业领域文书写作或有格式排版要求的写作使用此技能。"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\word\\SKILL.md"
prompt = "Office Word 的阅读、新建、修改，以及通过图片生成Word。不处理 飞书/豆包在线文档、PDF文件。党政公文、正式文书、商务与项目合同、专利司法等专业领域文书写作或有格式排版要求的写作使用此技能。\n\n要点：\n> ⚠️ **先读完再动手**：没见到末行「全文完」标记＝没读完，必须调整 offset 续读直到该标记。\n\n# Word\n\n## 权威经验\n\n1. **注意识别用户的需求**：如果用户要求需要交付的产物除了 Word 还包括其他内容，请完成本流程后继续完成对应产物的工作；在多轮情况下，注意用户的指令是否真的与 Word 操作有关，如果无法确认可以向用户询问，不要盲目的直接编辑用户的产物；Word产物大多适用严肃场景，除非用户有明确的要求，否则**禁止在产物中使用表情（emoji）**\n2. **按场景加载参考；加载的 workflow 必须完整读完**。明确提供“按需读取”导航的 CLI/XML 参考按导航完整读取公共与命中章节；其他参考默认完整读取；命中 workflow 明确限定某个样式小节时按其范围读取。上述例外不适用于用户附件。\n3. 用户附件必须**逐一盘点**，完整提取结果可以落盘保存，只把当前任务需要的证据载入上下文。\n4. 不预先读取无关参考目录，**禁止**将参考文件的渐进加载规则用于跳过用户附件。\n5. 要求的结构读取不可用、失败或结果不完整时，不得声称已经通过；先尝试修复，仍无法完成则报告阻塞。\n6. **重新阅读文档**：在多轮情况下，用户要求重新修改文档时，**必须重新阅读文档**，因为用户可能自己手动编辑过文件，此时文件的内容可能与上下文内容不一致，直接使用之前读取的内容会造成用户手动编辑的内容丢失。\n7. 无论改动是大是小、命令是否熟悉，无论此前是否用过类似命令、做过类似任务，无论之前是否读过对应分支的 MD 文档，**必须重新 Read 对应分支的 MD 文档之后才能动手。特别是多轮对话中用户对前轮已有 Word 的任何修改/追加/删除追问，都属于\"编辑已有 Word\"场景，本次动手前必须先按场景路由完整 Read 对应 workflow，不得凭上一轮记忆直接改中间文件。**\n8. **用户指定的工作目录优先于 skill 内置资源目录**。用户可能会指定`project directory`，作为用户的本地工作目录，当用户给出本地目录并要求从该目录选择、查找或使用模板/材料创建 Word 时，必须先盘点用户目录中的相关文件，并优先使用该目录下符合要求的文件；不得在未检查用户目录的情况下直接使用 `assets/templates` 中的内置模板。若用户没有指定`project directory`，请你在`Home directory`下执行相关操作。\n9. `Skill` 内置脚本因缺少 `Python` 模块而失败时，应优先读取[`requirements.txt`](requirements.txt)，安装缺失的模块。\n10. **最终给用户的回复不要过长**：最重要的产物是你最终生成的 `Word` 产物，而不是给"
