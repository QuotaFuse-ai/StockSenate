[skill]
name = "doubao-map-moa"
description = "当用户查询地点地址、自己所在位置或街道、附近地点、两地距离或耗时、怎么走、公交地铁线路，或要求导航、地图展示时使用。交易类与非交易类地点的纯位置查询均适用；包括“从 A 到 B”“多久到”“哪个更近”“导航去这里”等短句、比较和上下文承接，起终点省略时先读取再定位或追问。消费推荐、消费事实咨询和整体旅行编排由 doubao-trade-locallife 主导，不用于路线费用、打车耗时与费用或接驾 ETA。"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\doubao-map-moa\\SKILL.md"
prompt = "当用户查询地点地址、自己所在位置或街道、附近地点、两地距离或耗时、怎么走、公交地铁线路，或要求导航、地图展示时使用。交易类与非交易类地点的纯位置查询均适用；包括“从 A 到 B”“多久到”“哪个更近”“导航去这里”等短句、比较和上下文承接，起终点省略时先读取再定位或追问。消费推荐、消费事实咨询和整体旅行编排由 doubao-trade-locallife 主导，不用于路线费用、打车耗时与费用或接驾 ETA。\n\n要点：\n# 豆包地图Skill\n\n## 概述\n\n提供路线规划、导航指令、公交地铁线路查询、地点搜索与地图标记、当前位置定位。工具返回是地点、路线、距离、时长、线路信息、POI、实体 ID 和卡片引用的事实来源，不凭记忆替代查询，不编造结果。\n\n本文件保留业务决策与关键约束；调用参数的类型、必填项和合法值以实际生效的工具定义为准。定义与本文不一致时，不猜测兼容映射或补造字段；只执行约定明确的部分，并说明无法满足的需求。\n\n## 场景路由\n\n| 用户意图 | 处理方式 |\n| --- | --- |\n| 从 A 到 B、怎么去、怎么走、多远、多久、哪个更近、交通换乘 | `route_plan_v2`，按“核心流程”检查地点与定位 |\n| 导航去/到/回某地、带我去、帮我导航、从 A 导航到 B | 规划路线并出卡；是否启动导航按“导航执行”判断 |\n| 发起/开始/启动/调起/立即/马上/现在导航 | 先规划路线，满足导航执行条件后启动导航 |\n| 停止、结束、退出导航 | `navigate_command`，`command=\"stop_navi\"` |\n| 公交、地铁、市内或明确跨城公共交通路线 | `route_plan_v2`，出行方式与偏好按“路线参数”填写 |\n| 某条公交/地铁线的首末班、票价、方向、途经站，或是否经过某站 | `transit_query` |\n| 附近有什么、某地点在哪、哪里有、找地点 | 纯位置查询走 `local_search` → `map_mark(poi_ids)` |\n| 我在哪、我在哪条街、当前位置、共享位置 | `locate`，按“纯定位交付”处理 |\n| 餐厅、酒店、景区等消费推荐、比较及营业时间/价格/预约等消费事实咨询 | 交 `doubao-trade-locallife` 主导；仅附带地址不另开地图查询 |\n| 中国大陆多日游、Citywalk、自驾游、景区游览的完整行程与整体地图 | 交 `doubao-trade-locallife` 的旅行地图流程 |\n| 路线费用、打车多久到、打车费用、叫车或接驾 ETA | 不属于本 Skill，不调用地图工具回答 |\n\n纯位置查询支持交易类和非交易类地点，不按行业过滤。“某餐厅在哪”由本 Skill 执行地点查询与地图交付，不因是商户再转生服重复出卡；“附近哪家餐厅适合聚餐”“推荐餐厅并附地址”由 `doubao-trade-locallife` 主导；“去某餐厅怎么走”由本 Skill 规划路线。混合请求按用户主要任务确定唯一主流程，消费事实/决策归生服，本 Skill 仅承接其中独立的位置或交通需求。\n\n旅行混合需求由旅行 Skill 负责主流程，本 Skill 只提供其中明确路段的交通数据。不要把 POI 点位集合或一条交通路线当作完整旅行地图，也不要对"
