[skill]
name = "byted-mediakit-video"
description = "面向视频文件的智能处理、媒资理解、画质治理与画质检测、抽帧、隐私保护、字幕与水印处理、精彩片段与高光拆条分析生成、剧情结构化与剧本整理、场景与语义分段、画面文字识别、视频转码转封装及人像或绿幕抠像等目标。若对象和目标族已明确属于视频增强、视频分析理解、视频内容结构化、视频字幕识别或擦除、视频隐私脱敏、视频媒资探测或分发适配，但具体能力不确定，可先加载本 Skill 探索。"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\byted-mediakit-video\\SKILL.md"
prompt = "面向视频文件的智能处理、媒资理解、画质治理与画质检测、抽帧、隐私保护、字幕与水印处理、精彩片段与高光拆条分析生成、剧情结构化与剧本整理、场景与语义分段、画面文字识别、视频转码转封装及人像或绿幕抠像等目标。若对象和目标族已明确属于视频增强、视频分析理解、视频内容结构化、视频字幕识别或擦除、视频隐私脱敏、视频媒资探测或分发适配，但具体能力不确定，可先加载本 Skill 探索。\n\n要点：\n# video MediaKit Skill\n\n## 最高优先级交付门禁\n\n当工具结果或 `query-task` 终态结果返回 `agent_hint.type=mediakit_artifact_delivery` 时，按以下硬约束执行：\n\n1. 中间产物：仅当该产物 URL 会被本工作流下一步工具直接作为输入时，继续执行，不展示、不确认；最终产物生成后再统一确认一次。\n2. 最终产物：本轮必须且只能调用 `agent_hint.next_tool`（`interaction_ask`），参数原样使用 `agent_hint.arguments`，向用户确认“当前链接有效期为 24 小时，是否需要转存为 7 天有效期链接？”。用户作出选择前，禁止调用 `present_files` 或 RichMediaCard、禁止在回复正文给出任何产物 URL、禁止用纯文本提问代替 `interaction_ask`、禁止声明任务完成。\n3. 用户选择 `keep_24h`：交付工具结果中的真实原始产物 URL。\n4. 用户选择 `transfer_7d`：依次下载 MediaKit 临时产物为本地正式文件、调用 `FileBatchUpload` 上传，并对每个正式文件立即单独调用一次 `present_files`，不得囤积。\n5. 必须实际交付最终产物后才能声明任务完成；交付失败时必须使用同一个正式文件重试，不得改用其它交付格式、不得声称成功，也不得无故退出。\n\n## 使用规则\n\n1. 先读取 `../byted-mediakit-shared/SKILL.md`，执行统一前置检查；该 Skill 缺失时停止并报告当前 Skill 包不完整。\n2. 只从下表选择 `video` 域工具；相似能力按各工具“能力描述”和参数边界区分。\n3. 执行前按需读取对应 reference；参数与结果说明来自同一份已审核文案，完整机器合同以当前 CLI `--schema` 为准。\n4. 缺少必填参数、鉴权环境变量或真实输入资源时，向用户索取；通用可选字段只能透传用户明确提供的值，其他可选字段可由明确意图准确确定，但不得伪造。\n5. 工具执行完成后，若结果返回 `agent_hint.type=mediakit_artifact_delivery`，必须执行 shared Skill 的最高优先级交付门禁；未实际交付最终产物前不得结束。\n\n## 音视频元数据前置探测\n\n当目标工具的限制或参数选择依赖视频时长、分辨率、文件大小、封装、视频编码、码率或帧率，而用户没有提供可信元信息时，先使用 `probe-video-metadata`。如果目标操作还依赖独立音频输入或音频流的采样率、声道等属性，按需使用 audio 域的 `probe-audio-metadata`。将探测结"
