[skill]
name = "doubao-creative-video"
description = "当用户需要通用视频生成、视频创作、视频提示词规划或文生/图生视频时使用，包括创意视频、长视频规划、产品广告、商品广告、UGC 口播/带货/信息流视频、品牌 TVC、企业宣传片、商务视频、品牌形象片、产品功能介绍、知识讲解/科普/操作教程视频、门店服务/文旅推广视频、带旁白视频，以及带参考素材的视频生成。只有用户明确提出短剧、微电影、剧情短片、影视短片、动画短片、动态漫、分集剧情、长篇剧本或等价剧情影视制作场景时，才应调用 doubao-creative-drama；其他广告、品牌、企业、产品、UGC、创意、宣传、预告、活动和信息流视频需求默认仍使用本 skill。用户明确要求把短剧/剧情素材改"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\doubao-creative-video\\SKILL.md"
prompt = "当用户需要通用视频生成、视频创作、视频提示词规划或文生/图生视频时使用，包括创意视频、长视频规划、产品广告、商品广告、UGC 口播/带货/信息流视频、品牌 TVC、企业宣传片、商务视频、品牌形象片、产品功能介绍、知识讲解/科普/操作教程视频、门店服务/文旅推广视频、带旁白视频，以及带参考素材的视频生成。只有用户明确提出短剧、微电影、剧情短片、影视短片、动画短片、动态漫、分集剧情、长篇剧本或等价剧情影视制作场景时，才应调用 doubao-creative-drama；其他广告、品牌、企业、产品、UGC、创意、宣传、预告、活动和信息流视频需求默认仍使用本 skill。用户明确要求把短剧/剧情素材改\n\n要点：\n# 视频生成\n\n## 视频生成强规则\n\n1. **视频生成工具调用前必须确认生成参数。** 调用下列任一视频工具前，必须先用一句简短自然的开场白说明准备怎么做，再展示“视频生成参数确认”；参数区最前依次列本批实际使用的模型、时长、比例、条数，之后说明生成内容、适用素材用途和必要分段安排；风格、声音、台词等按实际需要补充，对用户的普通文本展示中，只有按需展示的分镜表使用表格，开场白、参数及其余说明均用 Markdown 段落或列表；简单任务默认不展示分镜表，具体按[展示详略](references/interaction-ask-video-clarification-ref.md#展示详略与表格使用)执行，并按[交互合同](references/interaction-ask-video-clarification-ref.md)调用 `interaction.ask` 询问「是否按照以上要求生成？」。只有用户明确选择「按要求生成」才可执行。选择「暂不生成」或尚未收到答复时，停止本批生成。同一确认覆盖本批列明的调用；参数或内容发生实质变化时，展示变更后的方案并重新确认。\n2. **每个需要交付的成功生成或编辑视频都必须立即交付给用户。** 用户取消或明确不再需要结果时，优先按[多轮消息处理](references/multi-turn-handling.md#取消生成)及[取消与拒收例外](references/media-delivery.md#取消与拒收例外)处理；以下逐项交付规则均适用这一例外。包括每个片段和工具返回的每个候选结果，按[媒体交付合同](references/media-delivery.md)逐项展示，不等待同批其他结果或后期。即使认为效果不佳，也禁止自行审片、反思后反复生成、扣留或筛掉结果。由用户判断效果；用户明确要求修改或重做时，再按第一条确认参数后执行。\n3. **执行分工。** mainagent 在确认前完成全部规划并确认全部生成参数，确认后创建 OrganizerAgent 执行和直接交付。创建时 `hint` 必须包含工具与生成参数、RichMediaCard 交付规范、全部交付及禁止反思校验约束，详见[生成与交付策略](#生成与交付策略)。澄清及生成确认继续由 mainagent 按原有 `interaction.ask` 策略执行。\n\n## 视频工具调用策略\n\n先按创作意图和实际输入选择工具。将已确认的 Prompt、生成规格和真实素材按宿主工具的实际 schema 传入。\n\n| 工具 | 何时使用 | 如何调用 |\n|---|---|---|\n| `image_to_video` | 以一张或多张图片生成新视频，媒体输入只有图片 | **用户传入图片作为视觉锚点时，必须将内容不变的原图作为实际图片输入传给工具。** "
