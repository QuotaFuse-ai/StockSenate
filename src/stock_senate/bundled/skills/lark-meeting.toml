[skill]
name = "lark-meeting"
description = "飞书视频会议：查询会议记录与会议产物(纪要/逐字稿/妙记)、妙记搜索/上传/下载/编辑；基于 meeting_id、meeting_no、event_id、note_id、minute_token、vc-node-id 或妙记 URL 查询相关信息。预约会议、忙闲和会议室管理走 lark-calendar。实时发言、会议字幕及事件、会中互动、录制控制和主持管理走 lark-meeting-realtime。"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\lark-meeting\\SKILL.md"
prompt = "飞书视频会议：查询会议记录与会议产物(纪要/逐字稿/妙记)、妙记搜索/上传/下载/编辑；基于 meeting_id、meeting_no、event_id、note_id、minute_token、vc-node-id 或妙记 URL 查询相关信息。预约会议、忙闲和会议室管理走 lark-calendar。实时发言、会议字幕及事件、会中互动、录制控制和主持管理走 lark-meeting-realtime。\n\n要点：\n# lark-meeting\n\n会议正在进行中或当前处于会议侧边栏时，**必须先读取 [lark-meeting-realtime](../lark-meeting-realtime/SKILL.md)**，再按其行动指南执行。\n\n本技能与 [lark-meeting-realtime](../lark-meeting-realtime/SKILL.md) **共同覆盖会议查询与会中操作**：本技能负责查询会议基础信息、会议记录、录音及录制产物，读取智能纪要、逐字稿及管理妙记；对方负责实时发言/聊天/共享内容问答、进行中会议状态查询、邀请参会人、会中文本/表情、会议聊天、倒计时、录制控制、主持管理和个人笔记。涉及对方能力时，先读取对方 Skill，不因本技能未列出而判断功能不支持。\n\n本产物所有命令自动以当前登录用户身份执行，无需传入身份参数，也没有身份选择或切换的需要。遇到未认证、token 或 scope 错误时，直接根据错误响应中的提示（如 `missing_scopes`、`console_url`）引导用户在应用后台补开权限后重试。\n\n## 会中操作\n\n交接时传递已有标识、用户目标和必要查询结果；已有唯一 `meeting_id` 时不重复发现会议。读取已生成的纪要或妙记仍由本技能处理。\n\n## 领域模型与概念\n\n[示例代码省略]\n\n| 对象 | 主标识 | 概念与关系 |\n|---|---|---|\n| Calendar 日程 | `event_id` | 日历上的日程，包含时间、参与人、会议室和 RSVP，可预约或关联 VC 会议；不是完整的会议记录。日程上的 `meeting_note` 是用户手工绑定的 Doc，与 AI 智能纪要无关。 |\n| Meeting 会议 | `meeting_id` | 实际发生的视频会议，可以来自 Calendar，也可以是没有日程的即时会议。会议主题、时间、参会人快照和会中事件属于会议数据；Note 与 Minutes 是它可能关联的会后产物。 |\n| IM Chat 会议聊天 | `chat_id` | 会议当前绑定的聊天，可能是群或复用的私聊；绑定查询与创建/复用属于 VC，消息读写属于 IM。 |\n| Note 智能纪要 | `note_id` | 开启 AI 总结后形成的逻辑产物集合。`note_display_type` 决定获取逐字稿中文字记录的不同方式。 |\n| Minutes 妙记 | `minute_token` | 由会议录制或本地音视频上传生成，包含总结、待办、章节、关键词、文字记录(别名：「转写」「逐字稿」「文字记录」)和原始音视频；可以关联 VC 会议，也可以独立存在。 |\n| Doc 文档 | Doc token | 内容载体，不是会议标识。`note_doc_token`、`s"
