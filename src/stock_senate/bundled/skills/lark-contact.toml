description = "飞书 / Lark 通讯录:按姓名 / 邮箱解析成 open_id,或按 open_id 反查姓名 / 部门 / 邮箱 / 联系方式 / 个人状态 / 签名,以及按关键词搜索当前用户可见的机器人 / 智能体(agent),也支持修改本人的签名、头像、飞书名片背景图/封面。当用户提到一个名字要下一步发消息 / 排日程,或拿到 open_id 想查具体信息,或要修改本人签名、头像或名片背景时使用。不支持修改他人资料。不负责部门树遍历、按部门列员工、组织架构图,这类需求走原生 OpenAPI。"
