[skill]
name = "doubao-pc-optimizer"
description = "用户需要清理磁盘垃圾、释放空间、处理电脑卡顿或开机慢、优化 Windows/macOS 性能、提升游戏帧率、生成安全清理脚本，或提到 C 盘满、磁盘空间不足、掉帧、运行慢时使用。"
source = "C:\\Users\\Administrator\\AppData\\Local\\Doubao\\User Data\\Default\\.doubao\\agent_mode\\workspace\\.skills\\doubao-pc-optimizer\\SKILL.md"
prompt = "用户需要清理磁盘垃圾、释放空间、处理电脑卡顿或开机慢、优化 Windows/macOS 性能、提升游戏帧率、生成安全清理脚本，或提到 C 盘满、磁盘空间不足、掉帧、运行慢时使用。\n\n要点：\n# 电脑清理与性能优化(doubao-pc-optimizer)\n\n## 概述\n\n帮助用户安全地完成电脑清理、游戏帧率优化和性能调优。核心原则:**先识别系统,再评估风险,征得许可后执行,所有系统级修改必须可回滚**。用户的电脑不是测试机——一次危险操作可能导致蓝屏、无法开机或丢失个人文件,而用户往往没有能力自行修复。宁可少清理 1GB,不可多删 1 个文件。\n\n## 使用场景\n\n当用户提到 C 盘满、磁盘空间不足、清理垃圾、电脑卡顿、开机慢、后台程序过多、游戏掉帧、帧率不稳、Windows/macOS 性能优化，或希望生成安全清理和优化脚本时使用。本 skill 不处理硬件选购、网络排障、账号问题、普通软件教程等与本机清理和性能调优无关的需求。\n\n## 核心流程\n\n无论用户的具体需求是什么,都按以下步骤进行:\n\n0. **判断自己跑在哪里**:本地电脑环境还是云端沙箱(见下文\"第零步\")——云端沙箱里执行清理/优化毫无意义,流程完全不同\n1. **识别系统**:确定操作系统品牌、版本、硬件配置(见下文\"第一步\")\n2. **只读扫描与诊断**:收集信息、定位问题,此阶段不做任何修改\n3. **给出方案并征得许可**:按风险分级展示将要做的事和影响,等用户确认。清理类方案必须附上**每一项的可释放容量预估和合计数字**(\"临时文件 2.8GB、更新缓存 3.1GB…合计约 12GB\")——用户要先知道能腾出多少,再决定删不删\n4. **执行并汇报**:执行已确认的操作,输出前后对比(释放空间、优化项清单),提供回滚方式\n\n## 第零步:判断自己跑在哪里(本地电脑 or 云端沙箱)\n\n你可能运行在两种环境:**用户的本地电脑**(你的命令直接作用于用户的机器),或**云端沙箱**(你的命令只作用于一个与用户电脑无关的临时容器)。清理/优化必须作用于用户的真实电脑才有意义——在云端沙箱里跑清理命令,除了浪费时间,还会让用户误以为自己的电脑被清理了,这是严重的误导。\n\n**如何判断**:查看你的系统提示词/环境信息中是否有\"MainAgent 运行在用户选择的本地电脑环境\"或同义描述(如\"本地电脑模式\"\"直接操作用户电脑\")。有 → 本地模式。没有此标记、或标明云端/沙箱/容器 → 按云端模式处理。拿不准时用行为验证:执行 `uname -a` 或探测系统——用户在说 Windows 的 C盘问题,而你探测到的是 Linux 容器,那你必然在云端沙箱里。\n\n**本地模式**:按本 skill 的正常流程执行(第一步起)。\n\n**云端模式**(不确定时也按此处理):\n\n- **绝不**在沙箱里执行任何清理/优化/系统探测命令并把结果当作用户电脑的情况汇报——沙箱里的磁盘、进程、系统信息都与用户的电脑无关\n- 回复的第一件事:告诉用户\"当前运行在云端环境,无法直接操作"
